[project]
name = "nexus-retail-allocation"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.162,<1",
  "sqlalchemy>=2.0,<3",
  "PyJWT>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2",
  "psycopg[binary]>=3.2,<4",
]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.fastapi.static]
cdn = true
